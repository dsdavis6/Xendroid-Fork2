name: Build Argosy-compatible APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install host shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned Android build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;29.0.14206865" \
            "cmake;3.30.3"

      # These Android build helpers are referenced by the checked-in CMake
      # files but omitted from this repository's source snapshot.
      - name: Restore XenDroid Android build helpers
        env:
          HELPER_BASE: https://raw.githubusercontent.com/rfandango/XenDroid/master/emulator-core/src/main/cpp/xenia/tools/build
        run: |
          helper_dir="emulator-core/src/main/cpp/xenia/tools/build"
          mkdir -p "$helper_dir"
          for helper in gen_android_spirv.py embed_bundle.py compile_shader_spirv.py shader_cc.cc; do
            curl --fail --location --silent --show-error \
              "$HELPER_BASE/$helper" -o "$helper_dir/$helper"
          done

      # Argosy's configured XenDroid integration expects package xendroid.compose.
      # Strip the fork's debug/release suffixes only in the ephemeral CI checkout.
      - name: Set Argosy-compatible application ID
        run: |
          sed -i "/applicationIdSuffix/d" app/build.gradle
          grep -q "applicationId 'xendroid.compose'" app/build.gradle

      - name: Configure persistent signing key (optional)
        env:
          XENDROID_KEYSTORE_BASE64: ${{ secrets.XENDROID_KEYSTORE_BASE64 }}
          XENDROID_STORE_PASSWORD: ${{ secrets.XENDROID_STORE_PASSWORD }}
          XENDROID_KEY_ALIAS: ${{ secrets.XENDROID_KEY_ALIAS }}
          XENDROID_KEY_PASSWORD: ${{ secrets.XENDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$XENDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No persistent signing key configured; this APK uses a temporary runner debug key."
            exit 0
          fi
          : "${XENDROID_STORE_PASSWORD:?Missing XENDROID_STORE_PASSWORD secret}"
          : "${XENDROID_KEY_ALIAS:?Missing XENDROID_KEY_ALIAS secret}"
          : "${XENDROID_KEY_PASSWORD:?Missing XENDROID_KEY_PASSWORD secret}"
          keystore="$RUNNER_TEMP/xendroid-signing.jks"
          printf '%s' "$XENDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "XENDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "XENDROID_STORE_PASSWORD=$XENDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "XENDROID_KEY_ALIAS=$XENDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "XENDROID_KEY_PASSWORD=$XENDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: bash gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xendroid-argosy-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
