name: Sync XenDroid upstream

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-xendroid-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for and merge upstream changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Eugengtt/Xendroid-Fork.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No upstream commits to merge."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Start APK build
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-argosy-apk.yml/dispatches" \
            -f ref=main
